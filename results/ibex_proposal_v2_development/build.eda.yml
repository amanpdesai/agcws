parameters:
  RVFI:
    datatype: bool
    paramtype: vlogdefine
    default: true
  RV32E:
    datatype: int
    paramtype: vlogparam
    description: Enable the E ISA extension (reduced register set) [0/1]
    default: 0
  RV32M:
    datatype: str
    paramtype: vlogdefine
    description: RV32M implementation parameter enum. See the ibex_pkg::rv32m_e enum
      in ibex_pkg.sv for permitted values.
    default: ibex_pkg::RV32MFast
  RV32B:
    datatype: str
    paramtype: vlogdefine
    description: Bitmanip implementation parameter enum. See the ibex_pkg::rv32b_e
      enum in ibex_pkg.sv for permitted values.
    default: ibex_pkg::RV32BNone
  RV32ZC:
    datatype: str
    paramtype: vlogdefine
    description: Compressed instructions parameter enum. See the ibex_pkg::rv32zc_e
      enum in ibex_pkg.sv for permitted values.
    default: ibex_pkg::RV32ZcaZcbZcmp
  RegFile:
    datatype: str
    paramtype: vlogdefine
    description: Register file implementation parameter enum. See the ibex_pkg::regfile_e
      enum in ibex_pkg.sv for permitted values.
    default: ibex_pkg::RegFileFF
  INSTR_CYCLE_DELAY:
    datatype: int
    paramtype: vlogdefine
    description: Number of cycles to delay the instruction RAM access. This is on
      top of the single-cycle access that the RAM requires.
    default: 0
  ICache:
    datatype: int
    paramtype: vlogparam
    description: Enable instruction cache
    default: 0
  ICacheScramble:
    datatype: int
    paramtype: vlogparam
    description: Enables ICache scrambling feature (EXPERIMENTAL) [0/1]
    default: 0
  ICacheECC:
    datatype: int
    paramtype: vlogparam
    description: Enable ECC protection in instruction cache
    default: 0
  BranchTargetALU:
    datatype: int
    paramtype: vlogparam
    description: Enables separate branch target ALU (increasing branch performance
      EXPERIMENTAL)
    default: 0
  WritebackStage:
    datatype: int
    paramtype: vlogparam
    description: Enables third pipeline stage (EXPERIMENTAL)
    default: 0
  SecureIbex:
    datatype: int
    paramtype: vlogparam
    description: Enables security hardening features (EXPERIMENTAL) [0/1]
    default: 0
  BranchPredictor:
    datatype: int
    paramtype: vlogparam
    description: Enables static branch prediction (EXPERIMENTAL)
    default: 0
  DbgTriggerEn:
    datatype: int
    paramtype: vlogparam
    description: 'Enable support for debug triggers. '
    default: 0
  PMPEnable:
    datatype: int
    paramtype: vlogparam
    description: Enable PMP
    default: 0
  PMPGranularity:
    datatype: int
    paramtype: vlogparam
    description: Granularity of NAPOT range, 0 = 4 byte, 1 = byte, 2 = 16 byte, 3
      = 32 byte etc
    default: 0
  PMPNumRegions:
    datatype: int
    paramtype: vlogparam
    description: Number of PMP regions
    default: 4
  MHPMCounterNum:
    datatype: int
    paramtype: vlogparam
    description: Number of performance monitor event counters [0/29]
    default: 12
  MHPMCounterWidth:
    datatype: int
    paramtype: vlogparam
    description: Bit width of performance monitor event counters [32/64]
    default: 40
  SRAMInitFile:
    datatype: str
    paramtype: vlogparam
    description: Path to a vmem file to initialize the RAM with
tool_options:
  verilator:
    verilator_options:
    - -DDISABLE_PRIM_CDC_RAND_DELAY
    - --trace
    - --trace-fst
    - --trace-structs
    - --trace-params
    - --trace-max-array 1024
    - -CFLAGS "-std=c++17 -Wall -DVM_TRACE_FMT_FST -DTOPLEVEL_NAME=ibex_simple_system
      -g"
    - -LDFLAGS "-pthread -lutil -lelf"
    - -Wall
    - --unroll-count 72
    mode: cc
filters: []
flow_options: {}
hooks:
  pre_build:
