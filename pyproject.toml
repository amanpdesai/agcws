[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agcws"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23", "pydantic>=2.0"]

[project.optional-dependencies]
chia = ["ray[default]==2.54.0", "google-genai>=1.64.0"]
dev = ["pytest>=8", "ruff>=0.8"]
analysis = ["matplotlib>=3.8"]
verification = ["myhdl>=0.11", "cocotb>=1.8,<2.0", "cocotb-test>=0.2.5", "cocotbext-axi>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
