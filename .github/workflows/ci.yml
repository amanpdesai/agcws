name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Check formatting and lint
        run: ruff check --select E9,F src scripts tests

  container:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build reproducibility image
        run: docker build --file docker/Dockerfile --tag agcws:ci .
      - name: Smoke test image
        run: >-
          docker run --rm agcws:ci /bin/sh -c
          'python -c "import os; from pathlib import Path; import subprocess;
          assert subprocess.run([os.environ[\"AGCWS_OPENSTA\"], \"-version\"], check=True).returncode == 0;
          assert Path(os.environ[\"AGCWS_LIBERTY\"]).exists();
          assert Path(os.environ[\"AGCWS_LIBERTY_NANGATE45\"]).exists()"'
